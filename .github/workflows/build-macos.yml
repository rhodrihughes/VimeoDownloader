name: Build macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build macOS app
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: pyinstaller build/mac.spec

      - name: Zip app bundle
        run: |
          cd dist
          zip -r VimeoDownloader-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip VimeoDownloader.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: dist/VimeoDownloader-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip
